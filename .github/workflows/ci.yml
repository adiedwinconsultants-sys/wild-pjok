name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@12.6.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Cek migrasi tidak berubah tanpa migrasi baru
        env:
          CI: ''
        run: |
          pnpm --filter @pjok/api db:generate
          git diff --exit-code -- apps/api/src/db/migrations
