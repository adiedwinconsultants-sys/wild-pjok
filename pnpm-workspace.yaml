packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@biomejs/biome": true
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@5.20261019.2-beta
  - wrangler@4.152.0

overrides:
  "esbuild@<=0.24.2": "0.28.2"
  "undici@>=7.0.0 <7.30.1": "7.30.1"
  "sharp@<0.35.5": "0.35.5"
  "zod@>=4.0.0 <4.6.6": "4.6.7"
  "ws@>=8.0.0 <8.21.0": "8.22.0"

patchedDependencies:
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
